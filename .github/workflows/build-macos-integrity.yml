name: Build macOS Universal2 Package - Integrity Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos-integrity.yml'

permissions:
  contents: read

env:
  PRAAT_VERSION: 7.0.01
  PRAAT_DMG_URL: https://github.com/praat/praat.github.io/releases/download/v7.0.01/praat7001_mac.dmg

jobs:
  build-macos-universal2:
    name: macOS Universal2 package
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout Praat AudioTools
        uses: actions/checkout@v4

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcodebuild -version
          cmake --version
          clang --version

      - name: Reconstruct and integrity-check CI payload
        shell: bash
        run: |
          set -euxo pipefail
          PART_DIR="Max-MSP/Praat_AudioTools_CI/payload"
          test -d "$PART_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import os

          part_dir = Path("Max-MSP/Praat_AudioTools_CI/payload")
          parts = sorted(part_dir.glob("ci_payload.tar.gz.b64.part*"))
          if not parts:
              raise SystemExit("No payload parts found")

          raw = b"".join(p.read_bytes() for p in parts)
          marker = b"[... ELLIPSIZATION ...]"
          count = raw.count(marker)
          print(f"Payload parts: {len(parts)}")
          print(f"Raw payload bytes: {len(raw)}")
          print(f"ELLIPSIZATION markers found: {count}")
          if count != 1:
              raise SystemExit(f"Expected exactly one ELLIPSIZATION marker, found {count}")
          raw = raw.replace(marker, b"")

          whitespace = set(b" \t\r\n\v\f")
          alphabet = set(b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          invalid = [(i, b) for i, b in enumerate(raw) if b not in alphabet and b not in whitespace]
          print(f"Non-Base64/non-whitespace bytes after marker removal: {len(invalid)}")
          if invalid:
              preview = ", ".join(f"offset {i}: 0x{b:02x}" for i, b in invalid[:40])
              raise SystemExit(f"Unexpected invalid bytes remain: {preview}")

          clean = bytes(b for b in raw if b not in whitespace)
          print(f"Base64 characters after cleanup: {len(clean)} (mod 4 = {len(clean) % 4})")
          if len(clean) % 4:
              raise SystemExit("Cleaned Base64 length is not divisible by 4")

          decoded = base64.b64decode(clean, validate=True)
          out = Path(os.environ["RUNNER_TEMP"]) / "ci_payload.tar.gz"
          out.write_bytes(decoded)
          print(f"Decoded payload bytes: {len(decoded)}")
          print(f"Decoded payload SHA256: {hashlib.sha256(decoded).hexdigest()}")
          PY

          gzip -t "$RUNNER_TEMP/ci_payload.tar.gz"
          tar -tzf "$RUNNER_TEMP/ci_payload.tar.gz" >/dev/null
          mkdir -p "$RUNNER_TEMP/praat-ci"
          tar -xzf "$RUNNER_TEMP/ci_payload.tar.gz" -C "$RUNNER_TEMP/praat-ci"
          test -f "$RUNNER_TEMP/praat-ci/source_project/source/AudioTools.praat~/AudioTools.praat~.cpp"
          test -f "$RUNNER_TEMP/praat-ci/package_template/Praat_AudioTools/patchers/praat.maxpat"

      - name: Configure Universal2 external
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -S "$RUNNER_TEMP/praat-ci/source_project" \
            -B "$RUNNER_TEMP/praat-build" \
            -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMAX_SDK_PACKAGE_OUT_OF_TREE=ON

      - name: Build Release external
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$RUNNER_TEMP/praat-build" --config Release --parallel 3

      - name: Locate, verify, and sign external
        id: external
        shell: bash
        run: |
          set -euxo pipefail
          MXO="$(find "$RUNNER_TEMP/praat-build" -type d -name 'AudioTools.praat~.mxo' -print -quit)"
          test -n "$MXO"
          BIN="$MXO/Contents/MacOS/AudioTools.praat~"
          test -x "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "External architectures: $ARCHS"
          echo "$ARCHS" | grep -q 'x86_64'
          echo "$ARCHS" | grep -q 'arm64'
          codesign --force --deep --sign - "$MXO"
          codesign --verify --deep --strict --verbose=2 "$MXO"
          echo "mxo=$MXO" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"
          file "$BIN"
          otool -L "$BIN"

      - name: Stage Max package and bundled library
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/stage"
          PKG="$STAGE/Praat_AudioTools"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$RUNNER_TEMP/praat-ci/package_template/Praat_AudioTools" "$PKG"
          mkdir -p "$PKG/externals" "$PKG/extras" "$PKG/misc/plugin_AudioTools" "$PKG/examples/Mac_CI_Smoke_Tests"
          ditto "${{ steps.external.outputs.mxo }}" "$PKG/externals/AudioTools.praat~.mxo"
          cp "$PKG/patchers/praat.maxpat" "$PKG/extras/Praat AudioTools.maxpat"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'Max-MSP/' \
            --exclude '.DS_Store' \
            --exclude '*.zip' \
            ./ "$PKG/misc/plugin_AudioTools/"
          cp "$RUNNER_TEMP/praat-ci/tests/"*.praat "$PKG/examples/Mac_CI_Smoke_Tests/"
          SCRIPT_COUNT="$(find "$PKG/misc/plugin_AudioTools" -type f -name '*.praat' | wc -l | tr -d ' ')"
          echo "Bundled .praat files: $SCRIPT_COUNT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "script_count=$SCRIPT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Download and bundle official Praat for macOS
        id: praat
        shell: bash
        run: |
          set -euxo pipefail
          DMG="$RUNNER_TEMP/praat.dmg"
          curl --fail --location --retry 3 --retry-delay 3 "$PRAAT_DMG_URL" --output "$DMG"
          ATTACH_LOG="$RUNNER_TEMP/hdiutil-attach.txt"
          hdiutil attach -nobrowse -readonly "$DMG" | tee "$ATTACH_LOG"
          MOUNT="$(awk -F '\t' '/\/Volumes\// {print $NF; exit}' "$ATTACH_LOG")"
          test -n "$MOUNT"
          PRAAT_APP="$(find "$MOUNT" -maxdepth 2 -type d -name 'Praat.app' -print -quit)"
          test -n "$PRAAT_APP"
          ditto "$PRAAT_APP" "${{ steps.package.outputs.pkg }}/externals/Praat.app"
          hdiutil detach "$MOUNT"
          PRAAT_BIN="${{ steps.package.outputs.pkg }}/externals/Praat.app/Contents/MacOS/Praat"
          test -x "$PRAAT_BIN"
          PRAAT_ARCHS="$(lipo -archs "$PRAAT_BIN")"
          echo "Praat architectures: $PRAAT_ARCHS"
          echo "$PRAAT_ARCHS" | grep -q 'x86_64'
          echo "$PRAAT_ARCHS" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "${{ steps.package.outputs.pkg }}/externals/Praat.app"
          echo "bin=$PRAAT_BIN" >> "$GITHUB_OUTPUT"
          echo "archs=$PRAAT_ARCHS" >> "$GITHUB_OUTPUT"

      - name: Headless Praat smoke test
        shell: bash
        run: |
          set -euxo pipefail
          TEST_SCRIPT="$RUNNER_TEMP/praat_ci_smoke.praat"
          cat > "$TEST_SCRIPT" <<'EOF'
          writeInfoLine: "PRAAT_CI_SMOKE_OK"
          EOF
          "${{ steps.praat.outputs.bin }}" --no-pref-files --run "$TEST_SCRIPT" > "$RUNNER_TEMP/praat-smoke.log" 2>&1
          cat "$RUNNER_TEMP/praat-smoke.log"
          grep -q 'PRAAT_CI_SMOKE_OK' "$RUNNER_TEMP/praat-smoke.log"

      - name: Verify assembled package
        shell: bash
        run: |
          set -euxo pipefail
          PKG="${{ steps.package.outputs.pkg }}"
          test -f "$PKG/package-info.json"
          test -f "$PKG/patchers/praat.maxpat"
          test -f "$PKG/extras/Praat AudioTools.maxpat"
          test -f "$PKG/javascript/AudioTools.praat.library.js"
          test -f "$PKG/javascript/AudioTools.praat.ui.js"
          test -f "$PKG/javascript/AudioTools.praat.info.js"
          test -d "$PKG/externals/AudioTools.praat~.mxo"
          test -d "$PKG/externals/Praat.app"
          test -d "$PKG/misc/plugin_AudioTools"
          python3 -m json.tool "$PKG/package-info.json" >/dev/null
          codesign --verify --deep --strict "$PKG/externals/AudioTools.praat~.mxo"
          codesign --verify --deep --strict "$PKG/externals/Praat.app"

      - name: Create distributable ZIP
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/Praat_AudioTools_1.0.0_macOS_Universal2.zip"
          cd "$(dirname '${{ steps.package.outputs.pkg }}')"
          ditto -c -k --sequesterRsrc --keepParent "$(basename '${{ steps.package.outputs.pkg }}')" "$OUT"
          shasum -a 256 "$OUT" | tee "$GITHUB_WORKSPACE/Praat_AudioTools_1.0.0_macOS_Universal2.sha256"

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praat_AudioTools-1.0.0-macOS-Universal2-integrity
          path: |
            Praat_AudioTools_1.0.0_macOS_Universal2.zip
            Praat_AudioTools_1.0.0_macOS_Universal2.sha256
          if-no-files-found: error
          retention-days: 30
